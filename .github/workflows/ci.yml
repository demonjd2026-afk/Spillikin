name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RELATE_SNAPSHOT_FORMAT: json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: The committed graph matches the SQL
        run: |
          spillikin build --project examples/meridian
          git diff --exit-code -- examples/meridian/store/graph.json
