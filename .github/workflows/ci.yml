name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RELATE_SNAPSHOT_FORMAT: json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: The committed graph matches the SQL
        run: |
          spillikin build --project examples/meridian
          git diff --exit-code -- examples/meridian/store/graph.json
      - name: The explorer's copy of the graph matches the store
        run: |
          spillikin export --project examples/meridian --out web/public/graph.json
          git diff --exit-code -- web/public/graph.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Browser engine agrees with the Python engine on every column
        run: npm run parity
        working-directory: web
